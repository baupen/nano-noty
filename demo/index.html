<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NOTY v3 Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Ubuntu:300,400,500,700&amp;subset=latin-ext" rel="stylesheet">
  <link rel="stylesheet" href="styles/bootstrap.min.css"/>
  <link rel="stylesheet" href="../lib/noty.css"/>
  <link rel="stylesheet" href="../lib/themes/mint.css"/>
  <link rel="stylesheet" href="../lib/themes/relax.css"/>
  <link rel="stylesheet" href="../lib/themes/sunset.css"/>
  <link rel="stylesheet" href="../lib/themes/semanticui.css"/>
  <link rel="stylesheet" href="../lib/themes/bootstrap-v3.css"/>
  <link rel="stylesheet" href="../lib/themes/bootstrap-v4.css"/>
  <link rel="stylesheet" href="styles/main.css"/>
</head>
<body>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-xl-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-2">Noty.js Demo</h1>
          <p class="text-body-secondary mb-4">
            Create a notification using the controls below.
          </p>
          <form id="notyForm" class="row g-3">
            <div class="col-12">
              <label for="text" class="form-label">Text</label>
              <input
                type="text"
                class="form-control"
                id="text"
                value="Hello from Noty!"
              >
            </div>

            <div class="col-sm-6">
              <label for="timeout" class="form-label">Timeout, ms</label>
              <input
                type="number"
                class="form-control"
                id="timeout"
                min="0"
                step="500"
                value="3000"
              >
              <div class="form-text">Use 0 to keep it open.</div>
            </div>

            <div class="col-sm-6">
              <label for="type" class="form-label">Type</label>
              <select class="form-select" id="type">
                <option value="alert">alert</option>
                <option value="success" selected>success</option>
                <option value="warning">warning</option>
                <option value="error">error</option>
                <option value="information">information</option>
              </select>
            </div>

            <div class="col-12 d-flex flex-wrap align-items-center gap-2">
              <button type="submit" class="btn btn-primary">CREATE</button>
              <button type="button" class="btn btn-outline-secondary" id="closeAll">
                Close all
              </button>

              <div class="ms-sm-auto">
                <label for="theme" class="visually-hidden">Theme</label>
                <select class="form-select form-select-sm w-auto" id="theme">
                  <option value="mint" selected>mint theme</option>
                  <option value="relax">relax theme</option>
                  <option value="sunset">sunset theme</option>
                  <option value="semanticui">semanticui theme</option>
                  <option value="bootstrap-v3">bootstrap-v3 theme</option>
                  <option value="bootstrap-v4">bootstrap-v4 theme</option>
                </select>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<script type="text/javascript" src="js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="../lib/noty.js"></script>
<script type="text/javascript" src="js/main.js"></script>

</body>
</html>
